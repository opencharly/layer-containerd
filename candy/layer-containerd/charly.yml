# The containerd layer: containerd installed and configured with ONE declarative choice that matters —
# the snapshotter. A host with no devmapper device (no LVM thin pool, no spare block device) can run the
# native/overlayfs path instead of losing the whole leg, and a host that DOES have the device can ask for
# devmapper without hand-typing a pool.
#
# The default is deliberately `native`: it needs no device, so the layer is useful everywhere, and
# choosing differently is one declared value rather than an edit to a generated file.
layer-containerd:
    candy:
        description: |
            containerd, installed and configured for the device-less case. It writes a version-2
            config.toml whose CRI default is the `native` snapshotter, and it ENABLES the `blockfile`
            snapshotter plugin so a microVM pool can be backed by a root drive without an LVM thin pool.
            The preparation step creates and formats the scratch image that the blockfile plugin clones,
            because that plugin loads as `error` without one (MEASURED: "failed to copy scratch: failed
            to open source .../scratch_file: no such file or directory"). A separate step also loads and
            persists `xt_multiport`, the iptables match the CNI `portmap` plugin needs: a rootless lease
            whose kernel module set lacks it cannot publish a port (MEASURED: "Extension multiport
            revision 0 not supported, missing kernel module?" and `iptables ... RULE_APPEND failed`). The
            daemon-reported assertion lives in this repo's own bed `check-containerd-vm`, which is where
            the substrate is asserted; this candy writes the config and prepares the directories it
            needs. A fully declared snapshotter and scratch size belong to the typed `containerd:`
            surface the ledger asks for.
        distro:
            fedora:
                # iptables-nft supplies the /usr/bin/iptables the CNI portmap plugin execs;
                # kmod supplies modprobe, which loads the match module below.
                package: [containerd, e2fsprogs, iptables-nft, kmod]
            arch:
                package: [containerd, e2fsprogs, iptables, kmod]
        service:
            # THE SERVICE, which is WI-8's own requirement and the half this layer was missing: containerd
            # is a daemon, so a bed that starts it with a shell & cannot survive its own step. The same
            # name appears twice because the two init systems need different forms, and the deploy picks
            # the one that matches: supervisord in a pod runs the command, systemd runs the packaged unit.
            # Measured the hard way: without this, ctr finds no socket and the layer own bed fails.
            - name: containerd
              exec: containerd --config /etc/containerd/config.toml
            - name: containerd
              use_packaged: containerd.service
              # MEASURED on a real VM (layer-fireactions#1's bed): the packaged unit loads but reads
              # "Loaded: loaded (...; disabled; preset: disabled)" - the distro ships containerd
              # DISABLED, and `enable:` defaults to false. Without this the substrate's own
              # precondition step ("containerd is present with the device-less snapshotter") cannot
              # pass, even though the config it checks IS correct: the snapshotter grep above it
              # succeeds and only `systemctl is-active` fails. The field is `enable`, not `enabled` -
              # spec/schema/boxmetadata.cue:55, and CUE's closed schema rejects the wrong spelling.
              enable: true
        plan:
            # The daemon needs /var/lib/containerd and /run/containerd. The package creates them owned by
            # root, and a POD runs its init as uid 1000 - where a service user=root setting is inert,
            # because a uid-1000 supervisord cannot setuid. Measured twice: the daemon died on its own
            # first mkdir (mkdir /var/lib/containerd: permission denied) and the socket never appeared. So
            # the layer makes the daemon directories writable by the identity that will run it, which is
            # what lets it start in a pod AND in a VM.
            - run: prepare the daemon state and root directories for the identity that will run it
              id: containerd-dirs
              run_as: root
              command: |
                set -eu
                mkdir -p /var/lib/containerd /run/containerd
                chown -R 1000:1000 /var/lib/containerd /run/containerd
                # The blockfile snapshotter CLONES a pre-existing, FORMATTED scratch image, so one must
                # exist before the daemon starts. Enabling the plugin without it loads the plugin as
                # `error` rather than `ok`: MEASURED - "failed to generate scratch file: failed to copy
                # scratch: failed to open source .../scratch_file: no such file or directory". Guarded,
                # because a re-run must never re-mkfs a file the running daemon is using.
                bf=/var/lib/containerd/io.containerd.snapshotter.v1.blockfile
                mkdir -p "$bf"
                  # The scratch image is a DECLARED size, overridable per deployment, because it bounds how
                  # much snapshot data a pool can hold. The filesystem is containerd's own `fs_type` below.
                  bf_size="${CHARLY_CONTAINERD_BLOCKFILE_SCRATCH_SIZE:-512M}"
                if [ ! -f "$bf/scratch_file" ]; then
                  bf_fs=ext4                                   # MUST match the plugin block's fs_type below
                  truncate -s "$bf_size" "$bf/scratch_file"
                  mkfs."$bf_fs" -qF "$bf/scratch_file"
                fi
            - run: write the containerd config with the snapshotter this layer was asked for
              id: containerd-config
              write: /etc/containerd/config.toml
              mode: "0644"
              run_as: root
              content: |
                # Written by the charly containerd layer. The snapshotter is the one declared to the
                # build; `native` needs no block device, `devmapper` needs an LVM thin pool that this
                # layer does not create for you.
                version = 2
                root = "/var/lib/containerd"
                state = "/run/containerd"

                [plugins."io.containerd.grpc.v1.cri".containerd]
                  snapshotter = "native"
                  disable_snapshot_annotations = false
                
                [plugins."io.containerd.snapshotter.v1.blockfile"]
                  root_path = "/var/lib/containerd/io.containerd.snapshotter.v1.blockfile"
                  scratch_file = "/var/lib/containerd/io.containerd.snapshotter.v1.blockfile/scratch_file"
                  fs_type = "ext4"
                  mount_options = []

                [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
                  runtime_type = "io.containerd.runc.v2"
            - run: load and persist the xt_multiport match the CNI portmap plugin needs
              id: containerd-xt-multiport
              run_as: root
              command: |
                set -eu
                mkdir -p /etc/modules-load.d
                printf '%s\n' xt_multiport > /etc/modules-load.d/charly-containerd.conf
                # A built IMAGE has no systemd (the kernel belongs to the venue that
                # runs it), so it only persists the declaration. A live venue loads the
                # module NOW, and MUST refuse to continue when the running kernel has no
                # module tree: a package upgrade that replaced it leaves the module
                # unloadable until a reboot, and a silent skip would surface later as a
                # port publish failing in the CNI plugin with nothing naming the cause.
                if [ -d /run/systemd/system ]; then
                  if [ ! -d "/lib/modules/$(uname -r)" ]; then
                    echo "the running kernel $(uname -r) has no module tree - a package upgrade replaced it; reboot this venue, then re-run" >&2
                    exit 1
                  fi
                  command -v modprobe >/dev/null 2>&1 || {
                    echo "modprobe is missing; the kmod package is required to load xt_multiport" >&2
                    exit 1
                  }
                  modprobe xt_multiport
                fi
            - check: the daemon the config belongs to is installed
              id: containerd-installed
              command: command -v containerd && containerd --version
