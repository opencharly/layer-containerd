# Makes this layer repo a PROJECT so its candy is gated, and carries the R10 witness.
discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true

# The witness: a disposable POD running the layer's own image. containerd is a daemon, so what must be
# asserted is that it STARTS with the rendered config and that the declared snapshotter reports `ok` in
# `ctr plugins ls` — the check the ledger asks for. A pod has no spare block device, which is exactly the
# DEVICE-LESS case: the native snapshotter must be `ok` there, and the devmapper path must skip VISIBLY
# rather than fail obscurely.
containerd-service:
    local:
        description: >-
            The containerd layer applied inside a guest: the daemon installed from the distro, the
            version-2 config rendered on the device-less snapshotter, and the packaged unit enabled so the
            guest's own systemd runs it as root.
        candy:
            - layer-containerd

containerd-vm-base:
    vm:
        source:
            # The rolling Arch cloud image, the same spelling the sibling layer's bed uses (dated pkgbuild
            # paths rotate away, opencharly/charly#826).
            kind: cloud_image
            url: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
            base_user: arch
            distro: arch
        backend: libvirt
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: bios
        ssh:
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                - sudo
            # The layer's package install runs a full `pacman -Syu`, which replaces the
            # RUNNING kernel's module tree and leaves xt_multiport (and nf_tables'
            # compat path) unloadable until a reboot - the issue's measured host state.
            # This bed tests the layer, not a kernel upgrade, so the fixture holds the
            # kernel; the layer itself refuses to continue with a reboot message on a
            # post-upgrade host (containerd-xt-multiport), which is the product behavior.
            bootcmd:
                - "sed -i 's|^#IgnorePkg.*|IgnorePkg = linux linux-headers|' /etc/pacman.conf"

check-containerd-vm:
    vm:
        from: containerd-vm-base
        disposable: true
        lifecycle: dev
        description: >-
            The containerd layer on a disposable guest: the candy installs the daemon and renders the
            config, the guest's own systemd runs the packaged unit AS ROOT (which is what a pod cannot do),
            and the plan asserts on the RUNNING guest that the declared snapshotter reports ok in
            `ctr plugins ls` — the check the ledger names. A pod has no root to offer, so this is the
            substrate containerd actually belongs to.
        check-containerd-vm-member:
            local:
                from: containerd-service
        plan:
            # MEASURED: this bed previously had NO plan at all - its own description promised one
            # ("the plan asserts on the RUNNING guest that the declared snapshotter reports ok in
            # `ctr plugins ls`") and the check-phase log said "No plan steps defined for this image".
            # A bed that deploys, checks nothing and cleans up reports PASS (steps=15) and proves
            # NOTHING - the vacuous-gate failure this leg has hit three times now. These are the
            # assertions the description already claimed.
            - check: the packaged containerd unit is RUNNING, not merely installed and enabled
              id: containerd-unit-active
              command: |
                set -eu
                # The change this bed gates is `enable: true`: the unit must be enabled AND active.
                # MEASURED on layer-fireactions#1's bed: the unit read
                # "Loaded: loaded (...; disabled; preset: disabled)" and only `systemctl is-active`
                # failed - so both halves are asserted here, and each reports itself.
                if ! systemctl is-enabled containerd.service >/dev/null 2>&1; then
                  echo "containerd.service is NOT enabled:" >&2
                  systemctl status containerd.service --no-pager 2>&1 | head -6 >&2
                  exit 1
                fi
                if ! systemctl is-active containerd.service >/dev/null 2>&1; then
                  echo "containerd.service is enabled but NOT active:" >&2
                  systemctl status containerd.service --no-pager 2>&1 | head -6 >&2
                  journalctl -u containerd.service -n 20 --no-pager 2>&1 | tail -12 >&2
                  exit 1
                fi
                systemctl is-enabled containerd.service
                systemctl is-active containerd.service
            - check: the declared snapshotter reports ok in ctr plugins ls
              id: containerd-snapshotter-ok
              command: |
                set -eu
                # MEASURED, first run: the list printed "blockfile ... skip" and charly TRUNCATED the
                # rest, so the row that decides this - native - was cut off. Two changes follow: assert
                # on native SPECIFICALLY (the config declares native, not "native or blockfile"), and
                # print only the snapshotter rows so the answer fits inside charly's stderr cap and
                # cannot be truncated away.
                sudo -n ctr plugins ls 2>&1 | grep -E 'TYPE|snapshotter' > /tmp/ctr-snap.txt || {
                  echo "ctr plugins ls produced no snapshotter rows:" >&2
                  sudo -n ctr plugins ls 2>&1 | head -20 >&2
                  exit 1; }
                cat /tmp/ctr-snap.txt
                if ! grep -E 'snapshotter.*[[:space:]]native[[:space:]].*[[:space:]]ok' /tmp/ctr-snap.txt >/dev/null 2>&1; then
                  echo "the DECLARED native snapshotter is not ok - the rows above are the whole answer" >&2
                  exit 1
                fi
                echo "native snapshotter: ok"
                # And the capability this change ADDS. The native assertion above passes with or without it,
                # so without this the bed could not fail for the property the change introduces (R7: a test
                # that cannot fail is invalid). MEASURED before the change: `blockfile ... skip`, and the
                # fireactions server refused to start on a guest whose only root-drive-capable snapshotter
                # it accepts is this one.
                if ! grep -E 'snapshotter.*[[:space:]]blockfile[[:space:]].*[[:space:]]ok' /tmp/ctr-snap.txt >/dev/null 2>&1; then
                  echo "blockfile is not ok - a Firecracker pool cannot back a root drive without it; the rows above are the whole answer" >&2
                  exit 1
                fi
                echo "blockfile snapshotter: ok"
            - check: xt_multiport is declared at boot and the CNI portmap rule loads in a rootless netns
              id: containerd-portmap-usable
              # A live-venue capability (a kernel module), not an image-build property: a
              # container shares the host kernel, so this assertion belongs to the running
              # host or guest and `charly check box` must skip it.
              context: [runtime]
              command: |
                set -eu
                conf=/etc/modules-load.d/charly-containerd.conf
                # The DECLARATION is the part this layer adds, and the only part that
                # distinguishes the fixed venue from the pre-fix one: a healthy kernel
                # auto-loads xt_multiport on first use, so the rule probe alone passes on
                # both. MEASURED on a fresh Arch guest: the module is absent from
                # /proc/modules, and the first multiport append loads it on demand.
                if ! grep -qx xt_multiport "$conf" 2>/dev/null; then
                  echo "$conf does not declare xt_multiport" >&2
                  echo "a boot would not pre-load the match the CNI portmap plugin needs" >&2
                  exit 1
                fi
                echo "$conf declares xt_multiport"
                # And the capability itself: reproduce the CNI portmap call exactly -
                # iptables -m multiport inside a rootless (user + network) namespace.
                # This fails on a venue whose running kernel has no loadable match.
                unshare -Urn sh -ec '
                  iptables -w -t nat -N CHARLY-PORTMAP-PROBE
                  iptables -w -t nat -A CHARLY-PORTMAP-PROBE -m multiport -p tcp --destination-ports 36133 -j ACCEPT
                  iptables -w -t nat -S CHARLY-PORTMAP-PROBE
                '
