# Makes this layer repo a PROJECT so its candy is gated, and carries the R10 witness.
discover:
    - path: box
      recursive: true
    - path: candy
      recursive: true

# The witness: a disposable POD running the layer's own image. containerd is a daemon, so what must be
# asserted is that it STARTS with the rendered config and that the declared snapshotter reports `ok` in
# `ctr plugins ls` — the check the ledger asks for. A pod has no spare block device, which is exactly the
# DEVICE-LESS case: the native snapshotter must be `ok` there, and the devmapper path must skip VISIBLY
# rather than fail obscurely.
containerd-service:
    local:
        description: >-
            The containerd layer applied inside a guest: the daemon installed from the distro, the
            version-2 config rendered on the device-less snapshotter, and the packaged unit enabled so the
            guest's own systemd runs it as root.
        candy:
            - layer-containerd

containerd-vm-base:
    vm:
        source:
            # The rolling Arch cloud image, the same spelling the sibling layer's bed uses (dated pkgbuild
            # paths rotate away, opencharly/charly#826).
            kind: cloud_image
            url: https://geo.mirror.pkgbuild.com/images/latest/Arch-Linux-x86_64-cloudimg.qcow2
            base_user: arch
            distro: arch
        backend: libvirt
        disk_size: 20G
        ram: 4G
        cpu: 2
        machine: q35
        firmware: bios
        ssh:
            port_auto: true
            key_source: generate
        cloud_init:
            timezone: UTC
            package:
                - sudo

check-containerd-vm:
    vm:
        from: containerd-vm-base
        disposable: true
        lifecycle: dev
        description: >-
            The containerd layer on a disposable guest: the candy installs the daemon and renders the
            config, the guest's own systemd runs the packaged unit AS ROOT (which is what a pod cannot do),
            and the plan asserts on the RUNNING guest that the declared snapshotter reports ok in
            `ctr plugins ls` — the check the ledger names. A pod has no root to offer, so this is the
            substrate containerd actually belongs to.
        check-containerd-vm-member:
            local:
                from: containerd-service
